# 每次 push / PR：一条命令跑完语法、宿主测试、打包产物、零运行时依赖、版本与 CHANGELOG 一致性。
# 客户端半（client.js 的真实渲染行为）在这里跑不了——需要 Electron 宿主，
# 靠 tools/probe.ps1 + test/probe-assertions.js 在本机验（见 README「自测」与「维护」）。
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: release check
        run: npm run release:check
