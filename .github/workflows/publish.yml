# 发 npm：默认只演练，确认后才真发。
#
# 走 **npm trusted publishing（OIDC）**，不存任何长期 token：
#   - 本 workflow 声明 id-token: write，npm 用它换一次性发布凭据；
#   - npmjs.com 上包的 Settings → Trusted publishing 里绑定这个仓库 + 这个 workflow 文件名；
#   - 首次发布还没有包时，OIDC 无处可绑，先在本机 `npm login` 手动发一次（见 README「发布与分享」）。
#
# 两个刻意的选择：
#   - 用 Node 24 而不是“Node 22 + 全局升级 npm”：Node 24 自带的 npm 11 已满足
#     trusted publishing 的最低版本，少一步全局安装就少一个与 ci.yml 不一致的变量
#     （之前在升级后跑 release check 会失败，而同样的命令在 ci.yml 里是绿的）。
#   - 不设 NODE_AUTH_TOKEN、不配 registry-url：那会写 .npmrc 里的 authToken 占位，绕过 OIDC。
name: publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = 只演练（不碰 registry，也不走 OIDC）；publish = 真发'
        type: choice
        options:
          - dry-run
          - publish
        default: dry-run

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: release check
        # 失败原因抬成 annotation：公开仓库的日志要鉴权才能下载，但 check-run 的
        # annotations 是公开可读的。注意 `run:` 默认带 bash -e，所以必须先 set +e
        # 再跑，否则失败会直接终止这一步，下面的标注代码根本执行不到。
        run: |
          set +e
          npm run release:check 2>&1 | tee release-check.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            { grep -E '^  FAIL|RELEASE-CHECK-FAILED|npm error' release-check.log || true; } | head -20 | while IFS= read -r line; do
              echo "::error title=release-check::$line"
            done
            tail -25 release-check.log | while IFS= read -r line; do
              echo "::error title=release-check-tail::$line"
            done
          fi
          exit "$status"
      - name: npm publish
        # 同上：`run:` 默认 bash -e，先 set +e 才能把失败原因做成 annotation。
        run: |
          mode="${{ inputs.mode }}"
          echo "::notice title=publish-mode::mode=$mode"
          node --version
          npm --version
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::notice title=oidc::available"
          else
            echo "::notice title=oidc::MISSING (id-token: write / permissions 没生效)"
          fi
          set +e
          if [ "$mode" = "publish" ]; then
            npm publish --provenance --access public 2>&1 | tee publish.log
          else
            npm publish --provenance --access public --dry-run 2>&1 | tee publish.log
          fi
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            { grep -Ei 'npm error|EOTP|E403|E404|ENEEDAUTH|provenance|trusted|oidc' publish.log || true; } |
              head -25 | while IFS= read -r line; do
                echo "::error title=npm-publish::$line"
              done
            tail -20 publish.log | while IFS= read -r line; do
              echo "::error title=npm-publish-tail::$line"
            done
          fi
          exit "$status"
