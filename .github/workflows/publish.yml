# 发 npm：默认只演练，确认后才真发。
#
# 这里走 **npm trusted publishing（OIDC）**，不存任何长期 token：
#   - 本 workflow 声明 id-token: write，npm 用它换一次性发布凭据；
#   - npmjs.com 上包的 Settings → Trusted publishing 里绑定这个仓库 + 这个 workflow 文件名；
#   - 首次发布还没有包时，OIDC 无处可绑，先在本机 `npm login` 手动发一次（见 README「发布与分享」）。
#
# 不设 NODE_AUTH_TOKEN：setup-node 的 registry-url 会写 .npmrc 里的 authToken 占位，
# 那会绕过 OIDC，所以这里刻意不配 registry-url。
name: publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只演练（npm publish --dry-run）'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 更新 npm（trusted publishing 需要较新版本）
        run: npm install -g npm@latest
      - name: release check
        # 失败时把原因抬成 annotation：公开仓库的日志要鉴权才能下载，
        # 但 check-run 的 annotations 是公开可读的，排查不用再靠猜。
        run: |
          set -o pipefail
          npm run release:check 2>&1 | tee release-check.log
          status=$?
          if [ $status -ne 0 ]; then
            grep -E '^  FAIL|Error|error' release-check.log | head -20 | while IFS= read -r line; do
              echo "::error title=release-check::$line"
            done
            tail -20 release-check.log | while IFS= read -r line; do
              echo "::error title=release-check(tail)::$line"
            done
          fi
          exit $status
      - name: npm publish
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
